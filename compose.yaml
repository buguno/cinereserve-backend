services:
  db:
    image: postgres:18.3-alpine
    container_name: cinereserve-db
    environment:
      POSTGRES_DB: cinereserve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinereserve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
