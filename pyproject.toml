[project]
name = "cinereserve-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "buguno",email = "brunnodesouzabezerra@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "gunicorn (>=25.1.0,<26.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
taskipy = "^1.14.1"
ruff = "^0.15.6"
typos = "^1.44.0"
pytest-django = "^4.12.0"
faker = "^40.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.coverage.run]
omit = [
    "manage.py",
    "conftest.py",
    "*/settings.py",
    "*/asgi.py",
    "*/wsgi.py",
    "*/migrations/*",
    "*/tests.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'python manage.py runserver'
migrations = 'python manage.py makemigrations'
migrate = 'python manage.py migrate'
superuser = 'python manage.py createsuperuser'
test = "pytest -q"
test_cov = "pytest --cov=. --cov-report=term-missing --cov-report=html"
test_movies = "pytest movies/tests.py -q"
test_showtimes = "pytest showtimes/tests.py -q"
test_tickets = "pytest tickets/tests.py -q"
test_users = "pytest users/tests.py -q"
